sonar.projectKey=presupuesto-familiar-app
sonar.projectName=Presupuesto Familiar App
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/tests,apps/web/src
sonar.test.inclusions=apps/api/tests/**/*.ts,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**,**/.vite/**,apps/web/public/**

sonar.javascript.lcov.reportPaths=coverage/api/lcov.info,coverage/web/lcov.info
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.sonar.json
